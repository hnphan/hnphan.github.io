const TW=40,TH=20,ZH=22,OX=130,OY=100,WALLH=4.2,N=6;
const P=(x,y,z=0)=>[OX+(x-y)*TW/2,OY+(x+y)*TH/2-z*ZH];
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const poly=(a,f,ex='')=>`<polygon points="${pts(a)}" fill="${f}" ${ex}/>`;
function shade(hex,k){const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k))));return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
const ol=c=>`stroke="#3a2416" stroke-width="1.05" stroke-linejoin="round"`;
function box(x,y,z,w,d,h,c,o={}){const t=z+h;
  const top=[P(x,y,t),P(x+w,y,t),P(x+w,y+d,t),P(x,y+d,t)],L=[P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,t),P(x,y+d,t)],R=[P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,t),P(x+w,y,t)];
  const st=o.noline?'':ol(c),op=o.op!=null?`fill-opacity="${o.op}"`:'';
  return poly(L,o.left||shade(c,-.14),st+' '+op)+poly(R,o.right||shade(c,-.28),st+' '+op)+poly(top,o.top||c,st+' '+op)}
const flat=(x,y,w,d,c,z=.01,ex='')=>poly([P(x,y,z),P(x+w,y,z),P(x+w,y+d,z),P(x,y+d,z)],c,ex);
const shape=(x,y,z,uv,c,ex='')=>poly(uv.map(([u,v])=>P(x+u,y+v,z)),c,ex);
function ell(x,y,z,r,c,ex=''){const a=[];for(let i=0;i<20;i++){const t=i/20*Math.PI*2;a.push(P(x+Math.cos(t)*r,y+Math.sin(t)*r,z))}return poly(a,c,ex)}
function ring(x,y,z,r1,r2,c){const loop=r=>{let s='';for(let i=0;i<=20;i++){const t=i/20*Math.PI*2,p=P(x+Math.cos(t)*r,y+Math.sin(t)*r,z);s+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}return s+'Z'};return `<path d="${loop(r1)}${loop(r2)}" fill="${c}" fill-rule="evenodd" ${ol(c)}/>`}
function faceCircle(cx,fy,cz,r,c,ex=''){const a=[];for(let i=0;i<20;i++){const t=i/20*Math.PI*2;a.push(P(cx+Math.cos(t)*r,fy,cz+Math.sin(t)*r*.85))}return poly(a,c,ex)}

function cot(x,y,sheet){let s=shadowAt(x,y,2.2,1.2);[[0,0],[2.1,0],[0,1.1],[2.1,1.1]].forEach(([a,b])=>s+=box(x+a,y+b,0,.1,.1,.55,'#b07a46'));
  s+=box(x,y,.45,2.2,1.2,.1,'#b07a46')+box(x+.05,y+.05,.55,2.1,1.1,.2,sheet,{top:sheet==='#ffffff'?'#fdfcff':sheet});
  for(let i=0;i<=10;i++)s+=box(x+i*.21,y+1.15,.55,.05,.05,.75,'#c99a62',{noline:1});for(let i=0;i<=5;i++)s+=box(x+2.15,y+i*.22,.55,.05,.05,.75,'#b07a46',{noline:1});
  s+=box(x,y+1.12,1.3,2.2,.08,.08,'#b07a46')+box(x+2.12,y,1.3,.08,1.2,.08,'#b07a46');return s}

function bottle(x,y,lvl){let s=shadowAt(x,y,.35,.35);if(lvl>0)s+=box(x+.03,y+.03,.02,.29,.29,.95*lvl,'#fff6df',{noline:1});
  s+=box(x,y,0,.35,.35,1,'#eef3e4',{op:.45})+box(x-.01,y-.01,1,.37,.37,.14,'#d9732b')+box(x+.09,y+.09,1.14,.17,.17,.22,'#f6c9a6');return s}

function roomSVG(c,mode){
  const sky=c.sky,lampOn=sky!=='day';
  let s=`<defs><radialGradient id="glow"><stop offset="0" stop-color="#ffd98a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
    ${['L','R'].map(k=>`<pattern id="folk${k}" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="skewY(${k==='L'?-26.565:26.565})"><g fill="${ROOMS[c.room].motif}" opacity=".5"><path d="M10 15 L10 9" stroke="${ROOMS[c.room].motif}" stroke-width="1"/><path d="M7 9 Q8.5 3 10 6 Q11.5 3 13 9 Q10 11 7 9Z"/><ellipse cx="8" cy="12.5" rx="1.8" ry=".9" transform="rotate(-30 8 12.5)"/><ellipse cx="12" cy="12.5" rx="1.8" ry=".9" transform="rotate(30 12 12.5)"/><circle cx="1" cy="1" r=".9"/><circle cx="19" cy="19" r=".9"/></g></pattern>`).join('')}
    <pattern id="grainP" width="64" height="64" patternUnits="userSpaceOnUse"><image href="${GRAIN()}" width="64" height="64"/></pattern></defs>`;
  // walls
  const R=ROOMS[c.room];
  const lw=[P(0,0,0),P(0,N,0),P(0,N,WALLH),P(0,0,WALLH)],rw=[P(0,0,0),P(N,0,0),P(N,0,WALLH),P(0,0,WALLH)];
  s+=poly(lw,R.walls[0])+poly(lw,'url(#folkL)')+poly(rw,R.walls[1])+poly(rw,'url(#folkR)');
  s+=poly([P(0,0,0),P(0,N,0),P(0,N,.25),P(0,0,.25)],'#f6ead2')+poly([P(0,0,0),P(N,0,0),P(N,0,.25),P(0,0,.25)],'#e9dcc0');
  s+=poly([P(0,0),P(N,0),P(N,N),P(0,N)],R.floor);
  for(let i=1;i<N;i+=R.tiles?.5:1){const a=P(i,0),b=P(i,N);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${R.line}" stroke-width=".8"/>`;if(R.tiles){const c1=P(0,i),c2=P(N,i);s+=`<line x1="${c1[0]}" y1="${c1[1]}" x2="${c2[0]}" y2="${c2[1]}" stroke="${R.line}" stroke-width=".8"/>`}}
  for(let g=.15;g<N;g+=.3){const a=P(0,g,.25),b=P(g,0,.25);s+=`<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="2.6" fill="#f6ead2" stroke="#3a2416" stroke-width=".6"/><circle cx="${b[0].toFixed(1)}" cy="${b[1].toFixed(1)}" r="2.6" fill="#e9dcc0" stroke="#3a2416" stroke-width=".6"/>`}
  const [rc,rx,ry,rw2,rd]=R.rug;const rugCols=[rc,'#e8b23a','#f6ead2','#7d8b3a',rc,'#d98b74'];
  rugCols.forEach((col,k)=>{const f=1-k*.15;const cx=rx+rw2/2,cy=ry+rd/2,a=[];for(let i=0;i<28;i++){const t=i/28*Math.PI*2;a.push(P(cx+Math.cos(t)*rw2/2*f,cy+Math.sin(t)*rd/2*f,.005+k*.001))}s+=poly(a,col,k===0?'stroke="#3a2416" stroke-width="1"':'')});
  if(R.wallFurn)s+=R.wallFurn();
  // window on left wall (gx=0) and clock on right wall (gy=0)
  s+=windowSVG(c.window||'win_'+sky);
  // lamp + furniture
  if(R.lamp)s+=box(.35,.35,0,.4,.4,.08,'#b08a6a')+box(.52,.52,.08,.06,.06,2.4,'#5a3a22',{noline:1})+box(.3,.3,2.4,.5,.5,.55,lampOn?'#ffe6a0':'#e8b23a');
  return s}
function windowSVG(kind){const y0=1.0,y1=2.8,z0=1.7,z1=3.6;let s=poly([P(0,y0-.1,z0-.1),P(0,y1+.1,z0-.1),P(0,y1+.1,z1+.1),P(0,y0-.1,z1+.1)],'#f6ead2',ol('#f6ead2'));
  const skyC=kind==='win_night'?'#26305e':kind==='win_dusk'?'#f6a07a':kind==='blind'?'#e9e3d6':'#a9c7c0';

  mcv.onpointermove=e=>{if(!MS||MS.phase!=='play')return;const [x,y]=pos(e);gm.move&&gm.move(MS.s,x,y)};
  mcv.onpointerup=mcv.onpointercancel=()=>{if(!MS||MS.phase!=='play')return;gm.up&&gm.up(MS.s)};
  mLast=performance.now();cancelAnimationFrame(mRaf);mRaf=requestAnimationFrame(mLoop)}
function mLoop(now){if(!MS)return;mRaf=requestAnimationFrame(mLoop);const dt=Math.min(.05,(now-mLast)/1000);mLast=now;const gm=MS.gm;
  if(MS.phase==='play'){MS.t+=dt;gm.update&&gm.update(MS.s,dt);if(MS&&MS.phase==='play'){const f=Math.max(0,1-MS.t/gm.dur);const el=$('mfill');if(el){el.style.width=(f*100)+'%';$('mbar').style.setProperty('--c',f>.5?'#5b6628':f>.25?'#c8612b':'#b8432a')}if(MS.t>=gm.dur)gm.timeout?gm.timeout(MS.s):mEnd(false)}}
  if(MS)gm.draw(MS.s,now/1000)}
function countdown(n){let el=$('bigc');const dv=M.querySelector('.diorama');if(!dv)return;if(!el){el=document.createElement('div');el.id='bigc';document.body.appendChild(el)}const r=dv.getBoundingClientRect();el.style.left=(r.left+r.width/2)+'px';el.style.top=(r.top+r.height*.42)+'px';el.textContent=n;el.className=n<=3?'hot':'';void el.offsetWidth;el.classList.add('beat')}
function toast(text,kind){const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.innerHTML=text;document.body.appendChild(t);const a=M.querySelector('.diorama');if(kind==='notif'){t.style.top='calc(env(safe-area-inset-top,0px) + 10px)';play('look')}else if(a){const r=a.getBoundingClientRect();t.style.top=(r.top+10)+'px'}setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),400)},kind==='notif'?4200:3200)}
function arm(el,ms){if(!el)return;el.disabled=true;el.classList.add('arming');el.style.setProperty('--arm',ms+'ms');setTimeout(()=>{el.disabled=false;el.classList.remove('arming')},ms)}
function mEnd(win,why){if(!MS||MS.phase!=='play')return;MS.phase='over';MS.s.done=win;const key=MS.key,L=MLINES[key];const line=rnd(win?L.win:(L[why]||L.lose||Object.values(L)[1]));
  play(win?'good':'bad');S.minis.push(win);if(win)S.score+=50;
  const reward=S.n<2?(win?'Reward: <b>+1 look</b> and <b>+10 seconds</b> on the next case.':'Penalty: <b>10 seconds less</b> on the next case.'):'';
  S.bonus=win?{looks:1,time:10}:{looks:0,time:-10};saveRun();
  setTimeout(()=>{const done=MS.done;$('ml').innerHTML=`<div class="mresult ${win?'win':'lose'}"><div class="verdict ${win?'v-good':'v-bad'}">${win?'Nailed it!':'Oh no!'}</div><p>${line}</p><p class="note">${reward}</p><button class="btn" id="mnext">Back to the case</button></div>`;
    arm($('mnext'),1100);$('mnext').onclick=()=>{cancelAnimationFrame(mRaf);MS=null;done()}},900)}

/* ---------- flow ---------- */
const S={phase:'title',n:0,results:[],c:null,score:0,minis:[],bonus:{looks:0,time:0},shift:[]};
let tick=null,hintsLeft=3;try{hintsLeft=3-(+localStorage.getItem('cf-hints')||0)}catch(_){}
const stop=()=>{const bc=$('bigc');if(bc)bc.remove();if(tick){clearInterval(tick);tick=null}};
function clearToasts(){document.querySelectorAll('.toast').forEach(t=>t.remove())}
function head(){if(S.phase!==head.last){clearToasts();head.last=S.phase}M.classList.toggle('mid',['title','mini','rank'].includes(S.phase));$('caseNo').textContent=S.phase==='case'||S.phase==='solved'?`Case ${S.n+1}/3 \u00b7 ${LEVELS[Math.min(S.n,2)].name.split(' ')[0]}`:S.phase==='mini'?'Baby!':'';const c=S.c;const tb=$('tbar');
  if(!c||!c.timeMax||S.phase!=='case'){tb.hidden=true;return}tb.hidden=false;const f=Math.max(0,c.timeLeft/c.timeMax);$('tfill').style.width=(f*100)+'%';tb.style.setProperty('--c',f>.5?'#5b6628':f>.25?'#c8612b':'#b8432a')}
const ls={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(_){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
function trailHTML(results,minis,pts){const cell=k=>{const r=results[k];return `<span class="tc ${r||''}">${r==='good'?'\u2713':r==='mid'?'\u00bd':r==='bad'?'\u2717':'?'}${pts&&pts[k]!=null?`<em>${pts[k]}</em>`:''}</span>`},
  mini=k=>`<span class="tb ${minis[k]===true?'good':minis[k]===false?'bad':''}">${minis[k]===true?'\u2605':minis[k]===false?'z':'!'}</span>`;
  return `<div class="trail">${[cell(0),mini(0),cell(1),mini(1),cell(2)].join('<i></i>')}</div>`}
function shareHTML(share){return `<div class="actions"><a class="btn" id="wa" href="https://wa.me/?text=${encodeURIComponent(share)}" target="_blank" rel="noopener">Send on WhatsApp</a><button class="btn ghost" id="copy">${navigator.share?'Share\u2026':'Copy'}</button></div>`}
function bindShare(share,share0){const GAME_URL='https://hnphan.github.io/nappy-files/';const copy=b=>{try{navigator.clipboard.writeText(share).then(()=>b.textContent='Copied!',()=>{b.textContent='Copy failed'})}catch(_){}};
  $('copy').onclick=e=>{const b=e.currentTarget;if(navigator.share){navigator.share({title:'The Nappy Files',text:share0,url:GAME_URL}).catch(err=>{if(err&&err.name!=='AbortError')copy(b)})}else copy(b)}}
function saveRun(extra){if(!S.daily)return;ls.set('nf-run',Object.assign({day:todayNo(),nextN:S.n+1,results:S.results,pts:S.pts,score:S.score,minis:S.minis,ws:S.ws,bonus:S.bonus,shift:S.shift,seed:S.seed},extra||{}))}
function title(){S.phase='title';stop();head();
  const res=ls.get('nf-res'),run=ls.get('nf-run');const done=res&&res.day===todayNo(),live=!done&&run&&run.day===todayNo();
  M.innerHTML=`<div class="center"><h2>Baby's screaming.<br>What happened?</h2>
    ${done?trailHTML(res.results,res.minis,res.pts):live?trailHTML(run.results,run.minis,run.pts):trailHTML([],[])}
    ${done?`<span class="label">Today's files #${todayNo()} \u00b7 ${res.score} pts \u00b7 ${res.r}</span>${shareHTML(res.share)}<button class="btn ghost" id="go">Random files</button>`
      :live?`<span class="label">Today's files \u00b7 #${todayNo()}</span><button class="btn" id="go">Carry on</button>`
      :`<span class="label">Today's files \u00b7 #${todayNo()}</span><button class="btn" id="go">Open the files</button>`}</div>`;
  M.querySelector('.center').insertAdjacentHTML('beforeend','<button class="chip" id="sndchip"></button>');sndUI();$('sndchip').onclick=toggleSound;
  if(done)bindShare(res.share,res.share0);
  $('go').onclick=()=>{audioInit();setTimeout(sndUI,150);if(done)newShift(false);else if(live)resume(run);else newShift(true)}}
function resume(run){Object.assign(S,{daily:true,seed:run.seed,results:run.results,pts:run.pts||[],score:run.score,minis:run.minis,ws:run.ws,bonus:run.bonus,shift:run.shift});S.n=run.nextN;if(S.n>=3)rank();else openCase()}
function newShift(daily){S.daily=!!daily;S.pts=[];{const R=daily?mulberry(todayNo()*104729+7):Math.random;S.notif={n:Math.floor(R()*3),i:Math.floor(R()*NOTIFS.length),delay:2000+R()*7000}}S.seed=daily?todayNo()*7919+13:Math.floor(Math.random()*1e9);RAND=mulberry(S.seed);S.n=0;S.ws=[];S.results=[];S.score=0;S.minis=[];S.bonus={looks:0,time:0};S.shift=shuffle(Object.keys(MINIS)).slice(0,2);openCase()}
function openCase(){RAND=mulberry(S.seed*31+S.n*977+1);const c=makeCase(S.n,(S.ws||[]).slice(0,S.n));(S.ws=S.ws||[])[S.n]=c.w,L=LEVELS[c.lv];S.c=c;
  c.looks=L.looks>50?99:L.looks+S.bonus.looks;c.timeMax=L.time?Math.max(15,L.time+S.bonus.time):0;c.timeLeft=c.timeMax;c.wrong=[];c.bonusNote=S.n>0&&L.time?(S.bonus.time>0?'+1 look, +10s':'-10s'):'';S.bonus={looks:0,time:0};
  S.phase='case';if(S.daily)saveRun({results:[...S.results,'bad'],pts:[...S.pts,0]});play('open');renderCase();const nf=S.notif;if(nf&&S.n===nf.n){const n0=S.n,[ic,who,msg]=NOTIFS[nf.i];setTimeout(()=>{if(S.phase==='case'&&S.n===n0)toast(`<i>${ic}</i><span><b>${who} \u00b7 now</b>${msg}</span>`,'notif')},nf.delay)}
  if(c.timeMax){stop();let grace=15;tick=setInterval(()=>{if(grace>0){grace--;return}c.timeLeft-=.1;head();worth();const dv=M.querySelector('.diorama');if(dv)dv.classList.toggle('urgent',c.timeLeft<10);const sec=Math.ceil(c.timeLeft);if(sec!==c.lastSec){c.lastSec=sec;if(sec===20){toast('20 seconds left!');play('tick')}if(sec<=10&&sec>0){countdown(sec);if(AU.on&&AU.ctx)tone(700+(10-sec)*90,.06,{vol:sec<=3?.12:.07,type:'square'});try{if(sec<=5&&navigator.vibrate)navigator.vibrate(30)}catch(_){}}}if(c.timeLeft<=0){c.timeLeft=0;c.pick=null;solve()}},100)}}
function renderCase(flash){const c=S.c,L=LEVELS[c.lv];head();
  const lo=c.last!=null?c.objs[c.last]:null,left=c.looks>50?null:c.looks-looksUsed(c);
  M.innerHTML=`<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2>Look closer</h2><span class="label tright">${c.bonusNote?`<span class="${c.bonusNote[0]==='+'?'up':'down'}">${c.bonusNote}</span> `:''}<b class="worth" id="worth"></b></span></div>
    <div class="tline"><b id="tl"></b></div>${diorama(c,'play')}
    <div class="zoom${flash?' flash':''}">${lo?`${zoomSVG(c,c.last)}<div class="txt"><b>${lo.name}</b>${lo.clue}</div>`:`<div class="txt"><b>Magnifier</b>${c.looks>50?'Tap things in the room to look closer.':`Only ${c.looks} looks now. Pick carefully.`}</div>`}${left!=null?`<span class="cnt" aria-label="${left} looks left"><i>${Array.from({length:c.looks},(_,k)=>`<b class="${k<left?'':'u'}"></b>`).join('')}</i>looks</span>`:''}</div>
    <div class="row" style="justify-content:space-between"><h2 style="font-size:inherit">What happened?</h2><span class="label tries">${[0,1].map(k=>`<b class="${k<c.wrong.length?'x':''}"></b>`).join('')} tries · wrong −8s</span></div>
    <div class="opts${c.opts.length>4?' six':''}">${c.opts.map(([w,t],k)=>`<button class="opt${c.wrong.includes(k)?' crossed':''}" data-ans="${k}" ${c.wrong.includes(k)?'disabled':''}>${storyName(w,t)}</button>`).join('')}</div>`;
  M.querySelectorAll('.diorama [data-obj]').forEach(g=>{const act=()=>{const i=+g.dataset.obj;let fl=false;try{localStorage.setItem('ns-tap','1')}catch(_){}if(!c.seen.includes(i)){if(!c.objs[i].wall&&looksUsed(c)>=c.looks){const n=M.querySelector('.zoom .cnt');if(n){n.classList.remove('nope');void n.offsetWidth;n.classList.add('nope')}play('bad');return}c.seen.push(i);play('look');if(hintsLeft>0){fl=true;hintsLeft--;try{localStorage.setItem('cf-hints',3-hintsLeft)}catch(_){}}}c.last=i;renderCase(fl)};
    g.addEventListener('click',act);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}})});
  M.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>guess(+b.dataset.ans));
  worth()}
function ptsBreak(c){const L=LEVELS[c.lv],spare=c.looks<50?Math.max(0,c.looks-looksUsed(c)):0,a=[`Solved +${c.wrong.length?50:100}`,`Time left +${Math.round(c.timeLeft*3)}`];if(spare)a.push(`Spare looks +${spare*15}`);if(L.mult>1)a.push(`${L.name.split(' ')[0]} \u00d7${L.mult}`);return a}
function caseWorth(c){const L=LEVELS[c.lv],spare=c.looks<50?Math.max(0,c.looks-looksUsed(c)):0;return Math.max(0,Math.round(((c.wrong.length?50:100)+c.timeLeft*3+spare*15)*L.mult))}
function worth(){const el=$('worth');if(el&&S.c){const t=Math.max(0,Math.ceil(S.c.timeLeft));el.textContent=`\u23f1 ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;el.classList.toggle('low',t<=10);const tl=$('tl');if(tl&&S.c.timeMax){tl.style.width=(100*S.c.timeLeft/S.c.timeMax).toFixed(1)+'%';tl.classList.toggle('low',t<=10);tl.classList.toggle('warn',t>10&&t<=20);tl.parentNode.classList.toggle('low',t<=10)}}}
function guess(k){const c=S.c;if(c.wrong.includes(k))return;const [w,t]=c.opts[k];
  if(w===c.w&&t===c.t){c.pick=k;solve();return}
  c.wrong.push(k);play('bad');c.timeLeft=Math.max(0,c.timeLeft-8);
  if(c.wrong.length>=2){c.pick=k;solve();return}
  const half=w===c.w||t===c.t;toast((half?'Not quite. One detail is right.':'Wrong suspect.')+' \u22128s. Last try!');renderCase()}
function solve(){stop();const c=S.c;S.phase='solved';head();
  let res,pts,msg;
  if(c.pick==null){res='bad';pts=0;msg='Out of time'}
  else{const [w,t]=c.opts[c.pick],ok=w===c.w&&t===c.t;res=ok?(c.wrong.length?'mid':'good'):'bad';pts=ok?caseWorth(c):0;msg=ok?(c.wrong.length?'Solved, second try':'Case closed!'):'Out of guesses'}
  S.score+=pts;S.results.push(res);S.pts.push(pts);saveRun();play(res);
  const keys=c.objs.filter(o=>o.key);const [pw,pt]=c.pick!=null?c.opts[c.pick]:[null,null];
  M.innerHTML=`<div class="row" style="justify-content:space-between"><div class="verdict v-${res}">${msg}</div><span class="label">+${pts} pts</span></div>${pts?`<div class="pts">${ptsBreak(c).map(x=>`<span>${x}</span>`).join('')}</div>`:''}
    ${diorama(c,'show')}
    <div class="clues"><span class="cl">Room: ${ROOMS[c.room].name}</span>${keys.map(o=>`<span class="cl">${o.name}: ${o.why}</span>`).join('')}</div>
    <div class="story"><b>${storyName(c.w,c.t)}.</b> ${WHAT[c.w].verdict} ${WHEN[c.t].quip}</div>
    ${c.wrong.length?`<p class="note">Your guess${c.wrong.length>1?'es':''}: ${c.wrong.map(k=>`<s>${storyName(...c.opts[k])}</s>`).join(', ')}</p>`:''}
    <div class="actions"><button class="btn" id="nx">${S.n<2?'Next case':'See your rank'}</button></div>`;
  arm($('nx'),900);$('nx').onclick=()=>{if(S.n<2){const k=S.shift[S.n];runMini(k,()=>{S.n++;openCase()})}else rank()}}
function rank(){S.phase='rank';stop();head();const r=rankFor(S.score);play('rank');
  const icons=S.results.map(x=>x==='good'?'\u{1F7E9}':x==='mid'?'\u{1F7E8}':'\u{1F7E5}').join('')+' '+S.minis.map(w=>w?'\u2B50':'\u{1F4A4}').join('');
  const GAME_URL='https://hnphan.github.io/nappy-files/';const share0=S.daily?`The Nappy Files #${todayNo()} \u{1F476}\n${icons} ${S.score} pts\n${r}\nSame 3 cases for everyone today. Can you beat me?`:`The Nappy Files \u{1F476} ${icons} ${S.score} pts. ${r}`;const share=share0+'\n'+GAME_URL;
  if(S.daily){ls.set('nf-res',{day:todayNo(),score:S.score,r,results:S.results,minis:S.minis,pts:S.pts,share,share0});try{localStorage.setItem('nf-day',String(todayNo()))}catch(_){}}
  M.innerHTML=`<div class="center"><div class="label">Your rank \u00b7 ${S.score} pts</div><div class="verdict v-good">${r}</div><p class="note" style="margin:0">${rnd(SIGNOFF)}</p>
    ${trailHTML(S.results,S.minis,S.pts)}
    ${shareHTML(share)}<button class="btn ghost" id="again">Random files</button></div>`;
  arm($('again'),1200);$('again').onclick=()=>newShift(false);bindShare(share,share0)}
function sel(){const el=$('share');const s=getSelection(),r=document.createRange();r.selectNodeContents(el);s.removeAllRanges();s.addRange(r)}
function toggleSound(){const live=AU.wasLive!==undefined?AU.wasLive:(AU.ctx&&AU.ctx.state==='running');AU.wasLive=undefined;if(AU.on&&!live){audioInit();setTimeout(()=>{sndUI();play('look')},120);return}AU.on=!AU.on;if(AU.master)AU.master.gain.value=AU.on?.5:0;try{localStorage.setItem('cf-sound',AU.on?'on':'off')}catch(_){}audioInit();sndUI();if(AU.on)play('look')}
$('snd').onclick=toggleSound;sndUI();document.addEventListener('visibilitychange',()=>setTimeout(sndUI,300));
document.addEventListener('pointerdown',()=>{AU.wasLive=!!(AU.ctx&&AU.ctx.state==='running');audioInit()},true);
title();
})();
