<style>
/* =====================================================================
   QUIDDLE: built from the game kit template (The Nappy Files).
   Layout: a page torn from a ration book. Ink-blue cover, a printed
   coupon value on top, four perforated coupons below, rubber stamps
   for the answer. Single look on purpose: works on any host theme.
   ===================================================================== */
:root{--bg:#22336b;--card:#e9ecdf;--card2:#dde1d0;--ink:#22336b;--muted:#5f6a86;--rule:#a9b0c4;--bad:#c4392b;
  --display:'Zilla Slab',Rockwell,'Roboto Slab',Georgia,serif;--body:'Courier Prime','Courier New',ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(255,255,255,.03) 3px 4px),var(--bg);color:var(--ink);font:400 14px/1.35 var(--body);overflow:hidden;-webkit-text-size-adjust:100%}
.wrap{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px;flex:none;color:var(--card)}
h1{font:700 24px/1 var(--display);margin:0;letter-spacing:.14em;text-transform:uppercase}
h1 small{display:block;font:400 10.5px var(--body);letter-spacing:.16em;margin-top:4px;opacity:.75}
.meta{display:flex;align-items:center;gap:10px;font:700 13px var(--body);letter-spacing:.06em}
/* the page: printed double rule inside the paper */
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:18px 16px 16px;background:var(--card);box-shadow:inset 0 0 0 6px var(--card),inset 0 0 0 7.5px var(--ink),0 8px 20px rgba(0,0,0,.35)}
main.mid{justify-content:center}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.label{font:700 11.5px var(--body);color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.note{margin:0;color:var(--muted)}
.verdict{font:700 26px var(--display);color:var(--ink);margin:0;text-wrap:balance}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
.btn{font:700 14px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--card);background:var(--ink);border:2px solid var(--ink);border-radius:0;padding:12px 20px;cursor:pointer;transition:opacity .35s,transform .35s}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.more{background:transparent;color:var(--ink);width:min(100%,300px);border-style:dashed}
.btn.arming{opacity:0;transform:translateY(6px);pointer-events:none}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.snd:focus-visible{outline:3px solid var(--bad);outline-offset:2px}
.chip{font:inherit;font-size:12px;background:transparent;border:0;border-bottom:1.5px dashed var(--muted);color:var(--muted);padding:4px 2px;cursor:pointer}
.snd{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--card);background:transparent;color:var(--card);font-size:16px;display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.snd[aria-pressed="false"]{opacity:.6}.snd[aria-pressed="false"]::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:1.5px;background:currentColor;transform:rotate(-40deg)}
.snd.locked{opacity:1;animation:sndp 1.6s ease-in-out infinite}.snd.locked::after{display:none}
@keyframes sndp{50%{box-shadow:0 0 0 6px rgba(233,236,223,.3)}}
/* results trail: tick boxes */
.trail{display:flex;align-items:center;gap:8px;margin:4px 0 14px}.trail i{display:none}
.trail span{display:grid;place-items:center;width:34px;height:34px;border:1.5px solid var(--ink);font:700 18px var(--display);color:var(--rule)}
.trail .good{color:var(--ink)}.trail .bad{color:var(--bad);border-color:var(--bad)}
/* coupon value box */
.sticker{flex:none;border:1.5px solid var(--ink);padding:8px 10px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;animation:print .4s ease-out both}
.sticker small{font:700 11px/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sticker small b{display:block;color:var(--ink)}
.sticker strong{font:700 52px/.9 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sticker.big strong{font-size:46px}
@keyframes print{from{opacity:0;filter:blur(2px)}to{opacity:1;filter:none}}
.q{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex:none}
.q b{font:600 17px var(--display)}.q span{font-size:12px;color:var(--muted)}
/* four perforated coupons */
.opts{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0;max-height:380px;border:1.5px dashed var(--ink)}
.opt{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:6px;text-align:left;font:inherit;color:var(--ink);background:transparent;border:0;border-radius:0;padding:10px 10px 8px;cursor:pointer;overflow:hidden;transition:background .2s,opacity .3s;min-width:0}
.opt:nth-child(odd){border-right:1.5px dashed var(--ink)}.opt:nth-child(-n+2){border-bottom:1.5px dashed var(--ink)}
.opt:active{background:var(--card2)}
.opt .e{font:700 11px var(--body);letter-spacing:.14em;color:var(--muted)}
.opt .n{min-width:0}.opt .n b{display:block;font:600 16.5px/1.15 var(--display);text-wrap:balance}.opt .n i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:3px}
.opt .p{font:700 20px/1.1 var(--display);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s}.opt .p small{display:block;font:400 11.5px var(--body);color:var(--muted)}
.opt.sel{background:var(--card2)}
.badge{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--card);font:700 14px var(--display);letter-spacing:0;margin-right:4px}.badge s{text-decoration-thickness:2px}.wrong .badge:first-child{background:var(--bad)}.badge.real{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.opt .e{min-height:24px}.sticker strong.ask{font-size:30px;line-height:1;text-align:right}
.opts.shown .opt{cursor:default}.opts.shown .p{opacity:1}
.opts.shown .opt:nth-child(2) .p{transition-delay:.1s}.opts.shown .opt:nth-child(3) .p{transition-delay:.2s}.opts.shown .opt:nth-child(4) .p{transition-delay:.3s}

/* rubber stamps */
.opt.right::after{position:absolute;right:8px;top:10px;font:700 15px/1 var(--body);letter-spacing:.18em;padding:5px 6px 4px 8px;border:2.5px solid currentColor;border-radius:3px;transform:rotate(-12deg);opacity:.85;animation:stamp .25s cubic-bezier(.3,1.6,.5,1) both}
.opt.right::after{content:'PAID';color:var(--ink)}
.opt.wrong .p{color:var(--bad)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.85}}
.after{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;min-height:48px;margin-top:auto}
.after>div{min-width:0}.after .verdict{font-size:22px;white-space:nowrap}.after small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hide{visibility:hidden}
.rankstamp{display:inline-block;font:700 26px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;padding:8px 14px 6px;border:4px double currentColor;transform:rotate(-4deg);margin:4px 0}
/* floating messages */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:60;max-width:min(92vw,420px);width:max-content;background:var(--bad);color:#fff;padding:8px 14px;font-weight:700;text-align:center;pointer-events:none;animation:tIn .3s cubic-bezier(.2,1.4,.4,1) both}
.toast.out{animation:tOut .35s ease-in both}
.toast.notif{background:#f6f6f1;color:#1d2230;text-align:left;display:flex;gap:10px;align-items:center;font:13px/1.3 system-ui,-apple-system,sans-serif;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:nIn .55s cubic-bezier(.2,1.3,.35,1) both}
.toast.notif.out{animation:nOut .4s ease-in both}.toast.notif b{display:block;font-size:11px;color:#6b7080}.toast.notif i{font-style:normal;font-size:24px}
@keyframes tIn{from{opacity:0;transform:translate(-50%,0) scale(.85)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes tOut{to{opacity:0;transform:translate(-50%,-8px)}}
@keyframes nIn{0%{opacity:0;transform:translate(-50%,-140%)}60%{opacity:1}100%{opacity:1;transform:translate(-50%,0)}}
@keyframes nOut{to{opacity:0;transform:translate(-50%,-140%)}}
.stg-ribbon{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:10px;z-index:90;background:var(--bad);color:#fff;font:800 11px/1 system-ui,sans-serif;letter-spacing:.12em;padding:5px 8px;pointer-events:none}
@media (orientation:landscape) and (max-height:500px){.wrap{display:none}body::after{content:'Turn your phone upright';position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--card)}}
@media (max-height:620px){main{padding:14px 13px 12px;gap:7px}.wrap{gap:6px}.sticker strong{font-size:40px}.opt{padding:8px 8px 6px}.opt .n b{font-size:15px}.after{min-height:44px}h1 small{display:none}}
@media (max-width:350px){h1{font-size:20px}.opt .n b{font-size:14.5px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
.btn,.opt,header,h1,.sticker{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.btn{white-space:nowrap}
.big{display:flex;gap:18px;margin:2px 0 6px}.big>div{display:flex;flex-direction:column;align-items:center}.big span{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}.big small{font:700 10px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mgo{flex:1;display:grid;place-items:center;font:700 80px var(--display);color:var(--ink)}
#pause{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:16px}
#pause .pcard{background:var(--card);padding:22px 26px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.card{flex:none;border:1.5px solid var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.card .lbl{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card b{font:700 26px/1.1 var(--display);text-wrap:balance}.card i{font-style:normal;color:var(--muted);font-size:13px}
.src{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcpt{width:100%;max-width:340px;font:400 13px/1.5 var(--body);text-align:left;border-top:1.5px dashed var(--ink);border-bottom:1.5px dashed var(--ink);padding:6px 0}
.rcpt div{display:flex;justify-content:space-between;gap:10px}.rcpt div span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rcpt .tot{font-weight:700;border-top:1px solid var(--rule);margin-top:4px;padding-top:4px}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;flex:none;border:1.5px solid var(--ink)}
.hud>div{display:flex;align-items:baseline;justify-content:center;gap:5px;padding:6px 4px}.hud>div+div{border-left:1.5px solid var(--ink)}
.hud span{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}.hud small{font:700 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.launch{flex:1;min-height:0;position:relative;border:1.5px dashed var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;padding:14px 16px 16px;overflow:hidden}
.launch .pack{width:min(78%,240px);flex:0 1 auto;min-height:0;max-height:42%;background:var(--card);border:1.5px solid var(--ink);padding:6px;animation:print .35s ease-out both}
.launch.fake .pack{filter:grayscale(.55) contrast(.95)}
.shelfrow{display:flex;gap:8px;justify-content:center;margin-bottom:6px}.shelfrow .pack{width:86px;background:var(--card);border:1.5px solid var(--ink);padding:3px}.shelfrow .pack:nth-child(2){transform:rotate(-4deg) translateY(-4px)}
.launch .new{font:700 12px var(--body);letter-spacing:.2em;text-transform:uppercase;border:1.5px solid var(--ink);padding:4px 8px 3px}
.launch b{font:700 30px/1.1 var(--display);text-wrap:balance;animation:print .35s ease-out both}
.launch .why{font-size:12.5px;color:var(--muted);max-width:32ch;min-height:3em}
.launch .clock{position:absolute;left:0;bottom:0;height:6px;background:var(--ink);width:100%}
.launch.real{background:var(--ink);color:var(--card)}.launch.real .new{border-color:var(--card)}.launch.real .why{color:var(--rule)}.launch.real .clock{display:none}
.launch.fake{background:#f2d6d1}.launch.fake b{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px}.launch.fake .clock{display:none}
.launch .stamp{position:absolute;top:14px;right:12px;font:700 16px/1 var(--body);letter-spacing:.18em;padding:6px 7px 5px 9px;border:3px solid currentColor;border-radius:3px;transform:rotate(-10deg);animation:stamp .25s cubic-bezier(.3,1.6,.5,1) both}
.launch.real .stamp{color:var(--card)}.launch.fake .stamp{color:var(--bad)}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.choose .btn{padding:16px 8px;font-size:15px}

.trace{display:flex;gap:4px;flex:none;justify-content:center}.trace i{width:16px;height:6px;background:var(--rule)}.trace i.g{background:var(--ink)}.trace i.r{background:var(--bad)}
.fine{font-size:10.5px;color:var(--muted);text-align:center;max-width:36ch;margin:0}
@media (max-height:620px){.launch .why{min-height:0}.launch b{font-size:22px}.launch .pack{max-height:36%}.shelfrow .pack{width:66px}.choose .btn{padding:12px 8px}.hud span{font-size:22px}}
@media (max-height:700px){.rcpt{font-size:11.5px;line-height:1.3;padding:4px 0}.rankstamp{font-size:22px;padding:6px 12px 4px}.center{gap:8px}}

.launch .stmt{font-size:24px;line-height:1.2}
.launch.t-quote .pack,.launch.t-tf .pack,.launch.t-line .pack{max-height:30%}
.choose.t-quote,.choose.t-line,.choose.t-price{grid-template-columns:1fr;gap:6px}

.choose.t-price .ans,.choose.t-line .ans{text-align:center;font-size:17px}
.choose.t-tf .ans{text-align:center;font:700 15px var(--body);letter-spacing:.12em;text-transform:uppercase}
.choose .ans.right{background:var(--ink);color:var(--card);border-color:var(--ink)}.choose .ans.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}.choose .ans.dim{opacity:.4}
.launch.t-quote.real,.launch.t-tf.real,.launch.t-line.real,.launch.t-price.real{background:var(--ink);color:var(--card)}
.launch.t-quote.fake,.launch.t-tf.fake,.launch.t-line.fake,.launch.t-price.fake{background:#f2d6d1}
.launch.t-quote.fake b,.launch.t-tf.fake b,.launch.t-line.fake b,.launch.t-price.fake b{text-decoration:none}
.launch.t-quote.real .why,.launch.t-tf.real .why,.launch.t-line.real .why,.launch.t-price.real .why{color:var(--rule)}
.launch.real .clock,.launch.fake .clock{display:none}
@media (max-height:700px){.launch.t-quote .pack{display:none}.launch.t-price .pack{max-height:26%}.choose .ans{padding:8px 10px;font-size:13px}.launch .stmt{font-size:20px}}
@media (max-height:620px){.launch .pack{max-height:28%}.launch.t-tf .pack,.launch.t-line .pack{display:none}}
.toast:not(.notif){top:44%;font:700 18px var(--display);padding:6px 16px}
</style>

/* ---------- the deck: five kinds of question, three acts ---------- */
const N=12;
const ACTS=[{name:'Warm-up',real:'easy',fake:'silly'},{name:'Getting tricky',real:'any',fake:'mid'},{name:'Director’s cut',real:'odd',fake:'sly'}];
const actOf=k=>ACTS[Math.min(2,Math.floor(k/4))];
const SECS={rf:[6,5,4],line:[8,8,8],tf:[7,7,6],price:[8,7,7],quote:[11,11,10]};
// which kinds go in each act (shuffled within the act)
const PLAN=[['line','rf','rf','rf'],['tf','price','rf','rf'],['quote','quote','tf','rf']];
const LABEL={rf:'Real or made up?',line:'Finish the line',tf:'True or false?',price:'Price check',quote:'What did Kathryn say?'};
const style=p=>p>=1000&&p%100===0?'pound':p%10===9?'nine':p%5===0?'five':'penny';
const fit=(x,st)=>{x=Math.max(10,x);return st==='pound'?Math.round(x/100)*100:st==='nine'?Math.max(9,Math.round((x+1)/10)*10-1):st==='five'?Math.round(x/5)*5:Math.round(x)};
const apartP=(a,b)=>Math.abs(a-b)>=Math.max(15,.15*Math.min(a,b));
function priceOpts(p){const st=style(p),pat=Math.floor(RAND()*3),L=[.5,.62,.75],H=[1.3,1.5,1.8];
  const from=pat===0?[H,H]:pat===1?[L,H]:[L,L];
  for(let t=0;t<100;t++){const v=from.map(s=>fit(p*s[Math.floor(RAND()*s.length)],st));if(apartP(v[0],v[1])&&apartP(v[0],p)&&apartP(v[1],p))return [p,...v].sort((a,b)=>a-b)}
  return [fit(p*.6,st),p,fit(p*1.5,st)]}
function buildDeck(){
  const reals=shuffle(REAL),fakes=shuffle(FAKE),used=new Set(),pool={quote:shuffle(QUOTES),line:shuffle(LINES),tf:shuffle(FACTS),price:shuffle(PRICES)};
  const take=(list,ok)=>{const x=list.find(x=>!used.has(x[0])&&ok(x))||list.find(x=>!used.has(x[0]));used.add(x[0]);return x};
  const plan=PLAN.map(a=>shuffle(a)).flat();
  const nRF=plan.filter(t=>t==='rf').length,realRF=shuffle(Array.from({length:nRF},(_,k)=>k<3+Math.floor(RAND()*2)));let rfi=0;
  // the price question must not repeat a product used elsewhere in the deck
  return plan.map((type,k)=>{const A=actOf(k),secs=SECS[type][Math.min(2,Math.floor(k/4))];
    if(type==='rf'){if(realRF[rfi++]){const x=take(reals,x=>A.real==='any'||x[5]===A.real);return {type,secs,n:x[0],why:x[1],kind:x[2],src:x[3],f:x[4],tier:x[5],real:true}}
      const x=take(fakes,x=>x[3]===A.fake);return {type,secs,n:x[0],why:x[1],kind:x[2],tier:x[3],real:false}}
    if(type==='quote'){const x=take(pool.quote,()=>true);const opts=shuffle([x[2],...shuffle(x[3]).slice(0,2)]);return {type,secs,n:x[0],kind:x[1],q:'What did Kathryn say about it?',opts,ans:x[2],src:x[4],note:'Her real words. The other two are ours.'}}
    if(type==='line'){const x=take(pool.line,()=>true);const opts=shuffle([x[1],...shuffle(x[2]).slice(0,2)]);return {type,secs,n:x[0],kind:x[4],q:'Fill in the blank',opts,ans:x[1],src:x[3],note:''}}
    if(type==='tf'){const x=take(pool.tf,()=>true);return {type,secs,n:x[0],kind:'phone',q:'True or false?',opts:['True','False'],ans:x[1]?'True':'False',src:x[3],note:x[2]}}
    const x=take(pool.price,x=>!used.has(x[0]+'#'));const ps=priceOpts(x[2]);return {type,secs,n:x[0],kind:x[1],q:'What did it cost at launch?',opts:ps.map(money),ans:money(x[2]),src:x[3],note:''}})}

const NOTIFS=[['\u{1F4AC}','Group chat','has anyone actually got the cookies??'],['\u{1F475}','Mum','is this the M&S lady you keep sending me?'],['\u{1F3E6}','Bank','Foodhall spending up 340% this month'],['\u{1F4C5}','Calendar','Cookie restock queue · 7:45am'],['\u{1F383}','Party invite','Fancy dress. You know who you’re going as.']];

const GAMEDEF={start(){S.deck=buildDeck();S.notif={k:3+Math.floor(RAND()*6),i:Math.floor(RAND()*NOTIFS.length)};S.k=0;S.log=[];S.streak=0;S.best=0;S.score=0;screen();card()},resume(){S.last=performance.now()}};
function screen(){M.innerHTML=`<div class="hud"><div><span id="sc">0</span><small>right</small></div><div><span id="st">0</span><small>streak</small></div><div><span id="nn">1</span><small>of ${N}</small></div></div>

  <div class="trace" id="trace">${Array.from({length:N},()=>'<i></i>').join('')}</div>
  <div class="choose" id="choose"></div>`}
function card(){const c=S.deck[S.k],A=actOf(S.k);hud(`${S.k+1}/${N}`);$('nn').textContent=S.k+1;S.secs=c.secs;S.t=c.secs;S.locked=false;
  if(S.k===S.notif.k){const [ic,who,msg]=NOTIFS[S.notif.i];setTimeout(()=>{if(S.k===S.notif.k&&!S.locked)toast(`<i>${ic}</i><span><b>${who} · now</b>${msg}</span>`,'notif')},1500)}
  const L=$('launch'),ch=$('choose');L.className='launch t-'+c.type;ch.className='choose t-'+c.type;ch.style.visibility='visible';
  if(c.type==='rf'){L.innerHTML=`${art(c.n,c.kind)}<span class="new">${LABEL.rf}</span><b>${c.n}</b><span class="why">${c.why}</span><span class="clock" id="clk"></span>`;

  else{const big=c.type==='tf'||c.type==='line';
    L.innerHTML=`${c.type==='quote'?art('speech','bubble'):art(c.n,c.kind)}<span class="new">${LABEL[c.type]}</span><b class="${big?'stmt':''}">${c.n}</b>${big?'':`<span class="why">${c.q}</span>`}<span class="clock" id="clk"></span>`;
    ch.innerHTML=c.opts.map((o,i)=>`<button class="btn ghost ans" data-o="${i}">${c.type==='quote'?'“'+o+'”':o}</button>`).join('');
    ch.querySelectorAll('.ans').forEach(b=>b.onclick=()=>answer(c.opts[+b.dataset.o]))}

function loop(now){if(!S.live)return;S.raf=requestAnimationFrame(loop);const dt=Math.min(.1,(now-S.last)/1000);S.last=now;if(S.paused)return;
  const before=Math.ceil(S.t);S.t-=dt;const c=$('clk');if(c)c.style.width=Math.max(0,S.t/S.secs*100)+'%';if(Math.ceil(S.t)<before&&S.t<2.5&&S.t>0)play('tick');
  if(S.t<=0)answer(null)}
const verdictLine=c=>!c.real?(c.tier==='silly'?'Nobody signed this off. We made it up.':c.tier==='sly'?'Believable, right? We made it up.':'Not an M&S product. We invented it.'):c.f===2?'Real, from 1998. City AM credits it to her.':c.f?`Real, and she showed it off. ${c.src}.`:c.tier==='odd'?`Sounds made up. It isn’t. ${c.src}.`:`A real M&S launch. ${c.src}.`;
function answer(said){if(S.locked)return;S.locked=true;S.live=false;cancelAnimationFrame(S.raf);const c=S.deck[S.k],ok=c.type==='rf'?said===c.real:said===c.ans;
  S.log.push(ok);if(ok){S.score++;S.streak++;S.best=Math.max(S.best,S.streak)}else S.streak=0;

  const L=$('launch'),ch=$('choose');
  if(c.type==='rf'){L.className='launch real'.replace('real',c.real?'real':'fake');
    L.querySelector('.new').textContent=c.real?(c.f===2?'Her own creation':c.f?'#KathrynSignedItOff':'Real M&S launch'):'Made up by us';
    L.querySelector('.why').textContent=verdictLine(c);
    L.insertAdjacentHTML('beforeend',`<span class="stamp">${c.real?'REAL':'MADE UP'}</span>`);ch.style.visibility='hidden'}
  else{L.className='launch t-'+c.type+(ok?' real':' fake');
    ch.querySelectorAll('.ans').forEach(b=>{const o=c.opts[+b.dataset.o];b.disabled=true;b.classList.toggle('right',o===c.ans);b.classList.toggle('wrong',o===said&&!ok);if(o!==c.ans&&o!==said)b.classList.add('dim')});
    const w=L.querySelector('.why')||L.querySelector('b');
    const msg=c.type==='quote'?`${c.note} ${c.src}.`:c.type==='tf'?`${c.note} ${c.src}.`:c.type==='price'?`${c.ans}, according to ${c.src}.`:`${c.src}.`;
    if(L.querySelector('.why'))L.querySelector('.why').textContent=msg;else L.insertAdjacentHTML('beforeend',`<span class="why">${msg}</span>`);
    L.insertAdjacentHTML('beforeend',`<span class="stamp">${ok?'SPOT ON':'NOPE'}</span>`)}
  if(said===null)toast('Too slow! Sold out.');else if(ok&&STREAK[S.streak])toast(STREAK[S.streak]);
  const wait=c.type==='rf'?(ok?1100:1700):(c.type==='quote'||c.type==='tf'?2600:1900);
  setTimeout(()=>{S.k++;S.k>=N?end():card()},wait)}
function end(){const R=[[0,'Got the ick'],[4,'Queued for nothing'],[6,'Picky bits fan'],[8,'Would follow her into war'],[10,'Corporate baddie'],[12,'Damehood pending']];const r=R.filter(x=>S.score>=x[0]).pop()[1];
  const ICON={rf:'\u{1F36A}',line:'✍️',tf:'❓',price:'\u{1F4B7}',quote:'\u{1F5E3}️'};
  finish({label:`${S.score} of ${N} right · best streak ${S.best}`,stamp:r,bad:S.score<6,line:`${S.score}/${N} · ${r}`,
    body:`<div class="acts">${ACTS.map((A,i)=>`<span>${A.name} <b>${S.log.slice(i*4,i*4+4).filter(Boolean).length}/4</b></span>`).join('')}</div><div class="rcpt">${S.deck.map((c,k)=>`<div><span>${S.log[k]?'✓':'✗'} ${c.type==='rf'?c.n:LABEL[c.type]+': '+(c.type==='tf'||c.type==='line'?c.n.replace(/[“”]/g,''):c.n)}</span><span>${c.type==='rf'?(c.real?'Real':'Made up'):c.type==='tf'?c.ans:''}</span></div>`).join('')}</div>`,
    note:'<span class="fine">Unofficial fan game, not made by M&amp;S. Her quotes are only ones the press reported. Made-up products and lines are ours.</span>',
    share0:`\u{1F48E} ${GAME.title}${tag()}\nHi, I’m ${r}. ${S.score}/${N} spotted.\n${[0,1,2].map(i=>S.deck.slice(i*4,i*4+4).map((c,j)=>S.log[i*4+j]?'\u{1F7E9}':'\u{1F7E5}').join('')).join(' ')}\n#TeamTurner`})}
